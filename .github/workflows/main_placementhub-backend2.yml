# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - placementhub-backend2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # All tests (with MySQL), frontend checks and Docker image scans. Nothing below runs
  # unless every CI job passes.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      # Tests already ran (and passed) in the ci job of this same run against MySQL;
      # this only packages the jar, with the project's pinned Maven wrapper.
      - name: Package the application
        run: ./mvnw -B -ntp clean package -DskipTests
        working-directory: ./backend

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/backend/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_995C95D03626407784A0972B039402FD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_58DC3781F36C43D29734B08D2A9A1311 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0468B8C31B11429DBC94DE79A293BD1E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'placementhub-backend2'
          slot-name: 'Production'
          package: '*.jar'