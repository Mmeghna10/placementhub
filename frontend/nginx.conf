# Serves the React build and forwards API calls to the backend container, so the browser
# only ever talks to one origin (no CORS, no hard-coded backend URL in the bundle).

# The port the browser used (e.g. 3000, or 3200 for the E2E stack), taken from its Host
# header. Inside the container nginx listens on 8080, so $server_port would be wrong.
map $http_host $browser_port {
    "~:(?<port>[0-9]+)$" $port;
    default             80;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container health check for nginx itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, API docs, health and (admin-only) metrics go to Spring Boot. "backend" is the
    # compose service name, resolved by Docker's internal DNS.
    location ~ ^/(api|v3/api-docs|swagger-ui|swagger-ui\.html|actuator/health|actuator/metrics) {
        proxy_pass http://backend:8080;
        # Keep the browser's host so the backend treats requests as same-origin.
        proxy_set_header Host $http_host;
        # The real client IP for rate limiting (Spring trusts X-Forwarded-* from this proxy).
        # nginx is the first proxy, so it REPLACES any X-Forwarded-For the client sent;
        # appending would let a client fake a new IP per request and dodge rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Without this, Tomcat applies X-Forwarded-Proto: http and resets the port to 80, so
        # a page on localhost:3200 looks cross-origin to Spring and every POST fails CORS.
        proxy_set_header X-Forwarded-Port $browser_port;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /student/jobs on refresh) get index.html and
    # React Router renders the page. index.html itself is never cached, so a new
    # deployment is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
