# Active when SPRING_PROFILES_ACTIVE=docker (set in compose.yaml).
# Datasource, JWT secret and other secrets still come from environment variables;
# this file only holds container-specific, non-secret defaults.

spring:
  jpa:
    show-sql: false

# Browsers reach the API through the nginx container on the same origin (/api), on any
# FRONTEND_PORT (nginx forwards the port, see nginx.conf), so no cross-origin requests are
# expected; the allow-list only covers a local Vite dev server.
app:
  cors:
    allowed-origins: http://localhost:5173

# Behind the nginx container: trust its X-Forwarded-For / -Proto headers (Tomcat only
# accepts them from private network addresses), so rate limiting sees the real client IP
# instead of nginx's.
server:
  forward-headers-strategy: native

logging:
  # One JSON object per line (Elastic Common Schema), including requestId from the MDC,
  # so logs can be shipped to and searched in a log tool instead of grepped as text.
  structured:
    format:
      console: ecs
  level:
    root: INFO
    # One line per startup migration is useful; per-statement SQL is not.
    org.flywaydb: INFO
