# Committed, non-secret defaults shared by every environment.
#
# Secrets and environment-specific values (datasource URL/credentials, app.jwt.secret,
# app.jwt.expiration-ms, gemini.api.key, gemini.api.model) come from either:
#   - local dev: the git-ignored src/main/resources/application.properties, or
#   - Azure / Docker: environment variables (SPRING_DATASOURCE_URL, APP_JWT_SECRET, ...).
# A value in application.properties or an environment variable overrides this file.

spring:
  jpa:
    # Keep the DB connection scoped to the service transaction instead of the whole
    # HTTP request; lazy loading outside a @Transactional service method now fails
    # loudly instead of silently issuing extra queries.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        # Safety net against N+1: lazy associations/collections not covered by a fetch
        # join are loaded in batches of up to 50 ids per query.
        default_batch_fetch_size: 50
        # Log any SQL statement slower than this (logger org.hibernate.SQL_SLOW).
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Databases created before Flyway already have the V1 tables. On a non-empty schema
    # without a history table, record V1 as applied instead of running it.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Pre-Flyway schema

  datasource:
    hikari:
      # Small pool + short transactions; MySQL handles this workload easily.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  lifecycle:
    # On SIGTERM (docker stop, redeploy) finish in-flight requests for up to 20 s before exiting.
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

# Health checks for Docker, Azure App Service and load balancers. Only health is exposed;
# no other actuator endpoint (env, beans, heapdump...) is reachable over HTTP.
#   /actuator/health/liveness  - the process is up (restart the container if this fails)
#   /actuator/health/readiness - also checks MySQL (stop sending traffic if this fails)
management:
  endpoints:
    web:
      exposure:
        # health is public (probes); metrics is ADMIN-only (see SecurityConfig).
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      # Publish p50/p95/p99 response times per endpoint (GET /actuator/metrics/http.server.requests.percentile).
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  pattern:
    # Prefix every plain-text log line with the request's correlation id (RequestIdFilter).
    correlation: "[%X{requestId:-}] "
  level:
    # Hibernate reports queries slower than the threshold below on this logger.
    org.hibernate.SQL_SLOW: INFO
