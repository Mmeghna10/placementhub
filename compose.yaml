# PlacementHub: MySQL + Spring Boot backend + React/nginx frontend.
#
#   1. copy .env.example .env   (then fill in the secrets)
#   2. docker compose up --build -d
#   3. open http://localhost:3000
#
# Start-up order is driven by health checks, not just container start order:
# mysql healthy -> backend ready (Flyway migrated, DB reachable) -> frontend starts.
# Data lives in the named volume "mysql-data" and survives `docker compose down`
# (only `docker compose down -v` deletes it).

name: placementhub

services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-placementhub}
      MYSQL_USER: ${MYSQL_USER:-placementhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Kolkata
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    # Only for MySQL Workbench on this computer (bound to 127.0.0.1, not the network).
    # 3307 avoids clashing with a MySQL already installed on 3306.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      # TCP on 127.0.0.1 so the check fails during first-time initialisation, when MySQL
      # runs a temporary server without networking; healthy = the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    image: placementhub-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # "mysql" is the service name above, resolved by Docker's internal DNS.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-placementhub}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-placementhub}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET (at least 32 characters) in .env}
      APP_JWT_EXPIRATIONMS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_BOOTSTRAPADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_BOOTSTRAPADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: without a key the app works, only the in-app AI guide answers "unavailable".
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_MODEL: ${GEMINI_API_MODEL:-gemini-3.6-flash}
      TZ: Asia/Kolkata
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Readiness includes the database, so "healthy" means it can really serve requests.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    # Give graceful shutdown (server.shutdown=graceful, 20 s) time before a hard kill.
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: placementhub-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  mysql-data:
